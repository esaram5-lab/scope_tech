; scope_tech 설정 파일 (UTF-8). ';' 뒤는 주석입니다.

[connection]
; usb : 스코프 뒷면 USB Device 포트. TekVISA 또는 NI-VISA 설치가 필요합니다.
; lan : 랜선 직결. 추가 설치가 필요 없습니다(스코프 Socket Server On, Protocol None).
interface = usb
; USB 장치 주소. 비워두면 Tektronix 장비를 자동으로 찾습니다.
; 예) USB0::0x0699::0x0522::C012345::INSTR
usb_resource =
; VISA DLL 경로. 비워두면 visa64.dll 자동 사용
visa_library =
; 연결 직후 USB Device Clear(이전 강제 종료로 남은 통신 정리). 연결 중 'USB Device Clear' 단계에서 멈추면 no
usb_clear = yes
; LAN 설정 (스코프 Utility > I/O > LAN 의 IP, Socket Server 포트)
ip = 192.168.0.10
port = 4000
timeout_s = 10

[session]
; 프로그램 시작 시 기본 시험 조건 (실행 중 temp / name / spec / type 명령으로 변경)
temp = 25
name = TEST
spec =
out_type = PP

[channels]
; 채널 이름: 결과 파일과 CSV 머리줄에 기록됩니다.
ch1 = IN_RAMP
ch2 = OUT
ch3 = CH3
ch4 = CH4
ch5 = CH5
ch6 = CH6
ch7 = CH7
ch8 = CH8

[defaults]
; 명령에서 채널을 생략했을 때 쓰는 값
vih_in = 1
vih_out = 2
voh = 2

[measure]
; VIL/VIH 측정 시 획득 모드를 High Res 로 변경 (노이즈 감소, 해상도 향상)
hires_for_vih = yes
; 단일 획득에서 트리거를 기다리는 최대 시간(초)
single_timeout_s = 30
; VOH/VOL 통계에 쓸 획득 횟수와 최대 대기 시간(초)
stats_acquisitions = 50
stats_timeout_s = 30
; 새 측정 시작 시 스코프의 기존 측정을 모두 지움 (no 면 이 프로그램이 만든 것만 지움)
clear_existing_measurements = yes
; VT+/VT- 를 읽을 때 전환 지점 앞뒤로 평균할 샘플 수 (노이즈 저감)
vin_avg_points = 10
; 출력 전환 시점으로 볼 레벨(출발 레벨에서 진폭 대비). 0.5 = 50% 지점.
; OD 출력처럼 상승이 느리면 0.1~0.2 로 낮추면 실제 전환 시작점에 가까워집니다.
out_cross = 0.5
; VOH/VOL 측정 시 첫 채널의 TOP/BASE 위치에 수평 커서 표시
voh_cursor = yes
; VIL/VIH 측정 때 출력 채널에 TOP/BASE 측정을 띄움 (VOH/VOL 값은 같은 파형에서 계산해 판정)
vih_output_meas = yes
; 매 측정 시작 전 통신 버퍼·오류·남은 Act On Event 를 정리하고 스코프 응답을 확인 (스코프 설정은 유지)
reset_each_run = yes

[capture]
; 흰 배경(잉크 절약) 화면 캡처. no 면 스코프 화면 그대로(검은 배경)
; 화면 캡처는 Act On Event 방식(Single 1회 획득 시 스코프가 직접 저장)으로 받습니다.
ink_saver = no
; 측정/커서를 바꾼 뒤 화면이 갱신될 때까지 기다리는 시간(초)
settle_s = 1.0
; 화면 캡처(Act On Event) 대기 시간(초). 트리거가 빠른 실제 신호(예: 250Hz)에서 캡처 중 멈추면 늘리세요.
;   aoe_arm_wait_s  : 저장 기능을 켠 뒤 Single 전까지
;   aoe_save_wait_s : Single 후 스코프가 PNG 를 쓰는 동안 아무 명령도 보내지 않는 시간
;   aoe_post_wait_s : 저장 후 저장 기능을 끄기 전, 그리고 끈 뒤 다음 동작 전
; 실측(2026-10-19): Single 후 약 0.7초 안에 PNG 저장 완료. 2/5/3 은 5/5 성공, 1/2/1 은 2회차 시작 때
; (AOE 해제 1.3초 뒤) USB 응답 끊김 -> post 만 3 으로 되돌린 1/2/3 사용. 다시 멈추면 2/5/3 으로 되돌리세요.
aoe_arm_wait_s = 1
aoe_save_wait_s = 2
aoe_post_wait_s = 3
; 캡처 PNG 가져오기 시점: end = 측정 중에는 스코프에 저장만 하고 종료할 때 한 번에 가져옴(권장)
;                         now = 캡처 직후 바로 가져옴(실장비 250Hz 트리거에서 TekScope 멈춤 사례)
; 가져오지 못한 파일은 captures/_pending_images.json 에 남고, py scope.py --fetch 로 다시 가져올 수 있음
image_fetch = end
; 파일을 하나씩 가져올 때 사이 간격(초)과, 가져온 뒤 스코프에서 지울지
fetch_gap_s = 1
delete_after_fetch = yes

[save]
; 저장할 채널: displayed = 화면에 켜진 채널 전부, 또는 1,2,3 처럼 지정
channels = displayed
; CSV(엑셀/파이썬 분석용), .wfm(스코프/TekScope 에서 다시 열기용), setup.set(스코프 설정)
csv = yes
wfm = yes
setup = yes

[scope]
; 스코프 내부 임시 폴더 (캡처/파형 파일을 잠시 만들었다가 PC로 가져온 뒤 지움)
temp_dir = C:/scope_tech_tmp
num_channels = 8

[output]
base_dir = captures
sim_dir = captures_sim
log_dir = logs

; ---------------------------------------------------------------- 판정 기준
; 값을 비워두면 판정하지 않고 측정값만 기록합니다(나중에 채우고 analyze.py 로 재판정 가능).
; 실제 기준은 SLG4AD4449 datasheet 값을 넣으세요.
;   vih_min : 입력 상승 시 VT+ 의 최댓값이 이 값 이하이면 PASS
;   vil_max : 입력 하강 시 VT- 의 최솟값이 이 값 이상이면 PASS
;   voh_min : TOP 의 최솟값이 이 값 이상이면 PASS (OD 출력은 판정 안 함)
;   vol_max : BASE 의 최댓값이 이 값 이하이면 PASS
;
; 참고용 JEDEC 일반값 (판정에 쓰지 말고 datasheet 확인):
;   LVCMOS 3.3V : VIH 2.0 / VIL 0.8 / VOH 2.4(@-2mA) / VOL 0.4(@2mA)
;   LVCMOS 1.8V : VIH 0.65*VDD(1.17) / VIL 0.35*VDD(0.63) / VOH VDD-0.45(1.35) / VOL 0.45

[spec:3V3]
vih_min =
vil_max =
voh_min =
vol_max =

[spec:1V8]
vih_min =
vil_max =
voh_min =
vol_max =

[spec:CMP1V]
vih_min =
vil_max =
voh_min =
vol_max =
